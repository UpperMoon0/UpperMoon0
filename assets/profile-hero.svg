<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Sunday Vo</title>
  <desc id="desc">Animated systems-style profile banner for Sunday Vo.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/>
      <stop offset="0.55" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#58d6c7"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b7cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58d6c7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8b949e" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bg{fill:#0d1117}.fg{fill:#f0f6fc}.muted{fill:#8b949e}.grid{fill:url(#grid)}
      .line{stroke:url(#fade);stroke-width:1.4;stroke-dasharray:9 14;animation:dash 11s linear infinite}
      .ring{fill:none;stroke:url(#accent);stroke-opacity:.35;stroke-width:1.4;transform-origin:970px 130px;animation:spin 20s linear infinite}
      .ring2{fill:none;stroke:#58d6c7;stroke-opacity:.18;stroke-width:1;transform-origin:970px 130px;animation:spin2 28s linear infinite}
      .pulse{fill:#6ea8fe;filter:url(#softGlow);animation:pulse 2.8s ease-in-out infinite}
      .scan{fill:url(#fade);opacity:.22;animation:scan 5.8s ease-in-out infinite}
      .micro{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.2px}
      .name{font:700 52px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px}
      .sub{font:500 17px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.2px}
      @keyframes dash{to{stroke-dashoffset:-180}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spin2{to{transform:rotate(-360deg)}}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
      @keyframes scan{0%,100%{transform:translateX(-180px)}50%{transform:translateX(1180px)}}
      @media (prefers-color-scheme: light){.bg{fill:#ffffff}.fg{fill:#111827}.muted{fill:#5f6b7a}.grid{opacity:.55}}
      @media (prefers-reduced-motion: reduce){.line,.ring,.ring2,.pulse,.scan{animation:none}}
    </style>
  </defs>

  <rect class="bg" width="1200" height="260" rx="18"/>
  <rect class="grid" width="1200" height="260" rx="18"/>
  <rect class="scan" x="0" y="0" width="150" height="260"/>

  <path class="line" d="M40 206H470C560 206 574 94 670 94H810" fill="none"/>
  <path class="line" d="M42 226H548C634 226 646 154 742 154H862" fill="none" opacity=".55"/>

  <text x="58" y="58" class="micro muted">UPPERMOON0 / SYSTEM PROFILE</text>
  <text x="58" y="128" class="name fg">SUNDAY VO</text>
  <text x="60" y="164" class="sub muted">systems · infrastructure · agents · game technology</text>
  <text x="60" y="211" class="micro" fill="#6ea8fe">BUILDING SOFTWARE WITH OPERATIONAL REACH</text>

  <g>
    <circle cx="970" cy="130" r="76" class="ring" stroke-dasharray="92 26 32 20"/>
    <circle cx="970" cy="130" r="103" class="ring2" stroke-dasharray="24 18 52 28"/>
    <circle cx="970" cy="130" r="8" fill="none" stroke="#8b7cf6" stroke-width="1.5"/>
    <circle cx="970" cy="130" r="3.8" class="pulse"/>
    <circle cx="970" cy="54" r="3" fill="#58d6c7"/>
    <circle cx="1065" cy="154" r="3" fill="#6ea8fe"/>
    <circle cx="901" cy="205" r="3" fill="#8b7cf6"/>
    <path d="M970 130L970 54M970 130L1065 154M970 130L901 205" stroke="#8b949e" stroke-opacity=".35" stroke-width="1"/>
    <text x="900" y="238" class="micro muted">NODE / ACTIVE</text>
  </g>
</svg>